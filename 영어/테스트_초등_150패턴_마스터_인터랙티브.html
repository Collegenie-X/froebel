<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 초등 150패턴 마스터 테스트</title>
<style>
  :root{
    --green:#38a169;--green-l:#c6f6d5;--green-ll:#f0fff4;
    --red:#e53e3e;--red-l:#fed7d7;--red-ll:#fff5f5;
    --yellow:#d69e2e;--yellow-l:#fefcbf;--yellow-ll:#fffff0;
    --blue:#4A90D9;--blue-l:#bee3f8;--blue-ll:#ebf8ff;
    --teal:#319795;--teal-l:#b2f5ea;--teal-ll:#e6fffa;
    --grad:linear-gradient(135deg,#11998e,#38ef7d);
    --bg:#f8f9fa;--card:#fff;--border:#e2e8f0;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:#2d3748;line-height:1.6;padding-bottom:60px}

  header{background:var(--grad);color:#fff;padding:28px 20px 20px;text-align:center}
  header h1{font-size:1.7rem;margin-bottom:6px}
  header p{font-size:.9rem;opacity:.9}
  .header-badges{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .badge{background:rgba(255,255,255,.22);border-radius:20px;padding:4px 14px;font-size:.8rem;font-weight:600}

  .score-board{max-width:760px;margin:16px auto;padding:0 16px}
  .score-card{background:#fff;border-radius:var(--radius);padding:16px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:var(--shadow);border:1.5px solid var(--border)}
  .score-item{text-align:center;flex:1;min-width:70px}
  .score-num{font-size:1.6rem;font-weight:800}
  .score-label{font-size:.75rem;color:#718096;font-weight:600}
  .score-correct .score-num{color:var(--green)}
  .score-wrong .score-num{color:var(--red)}
  .score-total .score-num{color:#11998e}
  .score-pct .score-num{color:#d69e2e}
  .score-div{width:1px;height:40px;background:var(--border)}
  .btn-reset{margin-left:auto;padding:7px 16px;border:none;border-radius:8px;background:#e2e8f0;color:#4a5568;font-size:.82rem;font-weight:700;cursor:pointer}
  .btn-reset:hover{background:#cbd5e0}

  .ctrl-bar{background:#fff;border-bottom:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .ctrl-bar input{flex:1;min-width:160px;padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:.88rem;outline:none}
  .ctrl-bar input:focus{border-color:#11998e}
  .cbtn{padding:7px 14px;border:none;border-radius:8px;cursor:pointer;font-size:.82rem;font-weight:700}
  .cbtn.expand{background:#11998e;color:#fff}.cbtn.collapse{background:#e2e8f0;color:#4a5568}
  .part-btn{padding:6px 12px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;font-size:.8rem;font-weight:700;background:#fff;color:#4a5568;transition:all .15s}
  .part-btn.active{background:#11998e;color:#fff;border-color:#11998e}

  .section-hdr{max-width:760px;margin:20px auto 10px;padding:0 16px}
  .section-hdr h2{font-size:1rem;font-weight:800;color:#11998e;padding:10px 14px;background:#fff;border-radius:var(--radius);border-left:4px solid #11998e;box-shadow:var(--shadow)}

  main{max-width:760px;margin:0 auto;padding:0 16px}
  .q-wrap{margin-bottom:10px}
  .q-details{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1.5px solid var(--border);overflow:hidden;transition:border-color .2s}
  .q-details.answered-ok{border-color:#68d391}
  .q-details.answered-ng{border-color:#fc8181}
  .q-summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 16px;list-style:none;user-select:none;background:linear-gradient(90deg,#f0fff4,#fff);transition:background .2s}
  .q-summary::-webkit-details-marker{display:none}
  .q-details[open] .q-summary{background:linear-gradient(90deg,var(--teal-ll),#f7ffff)}
  .q-summary:hover{background:var(--teal-ll)}
  .q-num{background:var(--grad);color:#fff;border-radius:7px;padding:3px 9px;font-size:.75rem;font-weight:700;white-space:nowrap}
  .q-part{font-size:.7rem;background:#e2e8f0;color:#718096;border-radius:8px;padding:2px 7px;font-weight:700}
  .q-text{font-size:.95rem;font-weight:700;flex:1}
  .q-hint-badge{font-size:.72rem;padding:2px 6px;border-radius:5px;font-weight:700;white-space:nowrap}
  .hint-easy{background:var(--green-l);color:#276749}
  .hint-mid{background:var(--yellow-l);color:#744210}
  .hint-hard{background:var(--red-l);color:#9b2c2c}
  .q-status{font-size:1rem;min-width:20px;text-align:center}

  .q-body{padding:12px 16px 16px;border-top:1px solid var(--border)}

  .hint-box{background:var(--yellow-ll);border:1.5px solid var(--yellow-l);border-radius:8px;padding:10px 14px;margin-bottom:10px;font-size:.88rem;font-family:monospace;color:#744210;letter-spacing:1px;display:none}
  .hint-box.visible{display:block}

  .ans-box{background:var(--green-ll);border:1.5px solid var(--green-l);border-radius:8px;padding:10px 14px;margin-bottom:10px;display:none;align-items:center;gap:10px}
  .ans-box.visible{display:flex}
  .ans-en{font-size:1rem;font-weight:800;color:#276749;flex:1}
  .ans-ko{font-size:.82rem;color:#4a5568;margin-top:2px}
  .btn-speak{padding:4px 12px;border:none;border-radius:6px;font-size:.76rem;cursor:pointer;font-weight:700;background:linear-gradient(135deg,#11998e,#38a169);color:#fff;white-space:nowrap;transition:all .2s;box-shadow:0 2px 5px rgba(17,153,142,.3)}
  .btn-speak:hover{transform:translateY(-1px)}
  .btn-speak.speaking{background:linear-gradient(135deg,#e53e3e,#c53030);animation:pulse .9s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.72}}

  .action-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn-hint{padding:6px 12px;border:1.5px solid var(--yellow-l);border-radius:7px;background:#fff;color:#744210;font-size:.78rem;font-weight:700;cursor:pointer}
  .btn-hint:hover{background:var(--yellow-ll)}
  .btn-show-ans{padding:6px 12px;border:1.5px solid var(--green-l);border-radius:7px;background:#fff;color:#276749;font-size:.78rem;font-weight:700;cursor:pointer}
  .btn-show-ans:hover{background:var(--green-ll)}
  .check-row{display:flex;gap:8px;align-items:center;margin-left:auto}
  .btn-ok{padding:6px 14px;border:none;border-radius:7px;background:var(--green);color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 2px 5px rgba(56,161,105,.3)}
  .btn-ok:hover{transform:translateY(-1px)}
  .btn-ng{padding:6px 14px;border:none;border-radius:7px;background:var(--red);color:#fff;font-size:.8rem;font-weight:700;cursor:pointer;box-shadow:0 2px 5px rgba(229,62,62,.3)}
  .btn-ng:hover{transform:translateY(-1px)}
  .btn-ok.selected{box-shadow:0 0 0 3px rgba(56,161,105,.5);transform:scale(1.06)}
  .btn-ng.selected{box-shadow:0 0 0 3px rgba(229,62,62,.5);transform:scale(1.06)}

  /* Progress bar */
  .prog-bar-wrap{max-width:760px;margin:0 auto 16px;padding:0 16px}
  .prog-bar-bg{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}
  .prog-bar-fill{height:100%;background:linear-gradient(90deg,#11998e,#38ef7d);border-radius:4px;transition:width .3s;width:0%}
  .prog-label{font-size:.75rem;color:#718096;text-align:right;margin-top:3px}

  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <h1>📚 초등 150패턴 마스터 테스트</h1>
  <p>한글→영어 · 영어→한글 · 청크 채우기 · 대화 완성하기</p>
  <div class="header-badges">
    <span class="badge">📝 4개 파트 · 150문제</span>
    <span class="badge">💡 힌트 3단계</span>
    <span class="badge">✅ 정답 확인</span>
    <span class="badge">🔊 정답 듣기</span>
    <span class="badge">📊 실시간 점수</span>
  </div>
</header>

<div class="ctrl-bar">
  <input type="text" id="searchBox" placeholder="🔍 문제 검색 (영어/한국어)..." oninput="filterQ()">
  <button class="cbtn expand" onclick="expandAll()">전체 펼치기</button>
  <button class="cbtn collapse" onclick="collapseAll()">전체 접기</button>
  <button class="part-btn active" onclick="filterPart(0,this)">전체</button>
  <button class="part-btn" onclick="filterPart(1,this)">Part 1</button>
  <button class="part-btn" onclick="filterPart(2,this)">Part 2</button>
  <button class="part-btn" onclick="filterPart(3,this)">Part 3</button>
  <button class="part-btn" onclick="filterPart(4,this)">Part 4</button>
</div>

<div class="score-board">
  <div class="score-card">
    <div class="score-item score-total"><div class="score-num" id="sTot">0</div><div class="score-label">풀었음</div></div>
    <div class="score-div"></div>
    <div class="score-item score-correct"><div class="score-num" id="sOk">0</div><div class="score-label">✅ 맞음</div></div>
    <div class="score-div"></div>
    <div class="score-item score-wrong"><div class="score-num" id="sNg">0</div><div class="score-label">❌ 틀림</div></div>
    <div class="score-div"></div>
    <div class="score-item score-pct"><div class="score-num" id="sPct">0%</div><div class="score-label">정답률</div></div>
    <button class="btn-reset" onclick="resetAll()">🔄 초기화</button>
  </div>
</div>

<div class="prog-bar-wrap">
  <div class="prog-bar-bg"><div class="prog-bar-fill" id="progFill"></div></div>
  <div class="prog-label" id="progLabel">0 / 120 문제 완료</div>
</div>

<main id="mainArea"></main>

let score = {ok:0, ng:0};
let currentUtterance = null;
let globalSpeed = 1;
let currentPartFilter = 0;
const TOTAL = QUESTIONS.length;

function hintClass(ht){ return ht==='🟢'?'hint-easy':ht==='🟡'?'hint-mid':'hint-hard'; }
function partLabel(p){ return ['전체','Part 1: 한글→영어','Part 2: 영어→한글','Part 3: 청크 채우기','Part 4: 대화 완성'][p]; }

function buildQuestions(){
  const main = document.getElementById('mainArea');
  let lastCat = '';
  QUESTIONS.forEach(q=>{
    if(q.cat !== lastCat){
      const sd = document.createElement('div');
      sd.className='section-hdr'; sd.setAttribute('data-part', q.part);
      sd.innerHTML=`<h2>${partLabel(q.part)} — ${q.cat}</h2>`;
      main.appendChild(sd);
      lastCat = q.cat;
    }
    const wrap = document.createElement('div');
    wrap.className='q-wrap'; wrap.id='q-'+q.no;
    wrap.dataset.part = q.part;
    wrap.dataset.text = (q.q+' '+q.en+' '+q.ko).toLowerCase();
    wrap.innerHTML = makeQHTML(q);
    main.appendChild(wrap);
  });
}

function makeQHTML(q){
  const hasHint = q.hint && q.hint !== '';
  const hintBtn = hasHint ? `<button class="btn-hint" onclick="toggleHint(this)">💡 힌트 보기</button>` : '';
  const hintBox = hasHint ? `<div class="hint-box">${q.hint}</div>` : '';
  const qText = q.q.replace(/\n/g,'<br>');

  return `
  <details class="q-details" id="qd-${q.no}">
    <summary class="q-summary">
      <span class="q-num">${q.no}</span>
      <span class="q-part">Part ${q.part}</span>
      <div class="q-text" style="white-space:pre-line">${qText}</div>
      <span class="q-hint-badge ${hintClass(q.ht)}">${q.ht}</span>
      <span class="q-status" id="st-${q.no}">⬜</span>
    </summary>
    <div class="q-body">
      ${hintBox}
      <div class="ans-box" id="ab-${q.no}">
        <div style="flex:1">
          <div class="ans-en">${q.en}</div>
          <div class="ans-ko">${q.ko}</div>
        </div>
        <button class="btn-speak" onclick="speakAnswer(this,'${escQ(q.en)}')">🔊 듣기</button>
      </div>
      <div class="action-row">
        ${hintBtn}
        <button class="btn-show-ans" onclick="toggleAns(this,'${q.no}')">✅ 정답 확인</button>
        <div class="check-row">
          <button class="btn-ok" onclick="markQ('${q.no}','ok',this)">⭕ 맞음</button>
          <button class="btn-ng" onclick="markQ('${q.no}','ng',this)">❌ 틀림</button>
        </div>
      </div>
    </div>
  </details>`;
}

function escQ(s){ return s.replace(/'/g,"\\'"); }

function toggleHint(btn){
  const box = btn.closest('.q-body').querySelector('.hint-box');
  if(!box) return;
  const vis = box.classList.toggle('visible');
  btn.textContent = vis ? '💡 힌트 숨기기' : '💡 힌트 보기';
}

function toggleAns(btn, no){
  const box = document.getElementById('ab-'+no);
  const vis = box.classList.toggle('visible');
  btn.textContent = vis ? '🙈 정답 숨기기' : '✅ 정답 확인';
  if(vis){
    const qd = document.getElementById('qd-'+no);
    if(!qd.hasAttribute('open')) qd.setAttribute('open','');
  }
}

function speakAnswer(btn, text){
  if(currentUtterance){ speechSynthesis.cancel(); currentUtterance=null; }
  btn.classList.add('speaking'); btn.textContent='⏸ 정지';
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=globalSpeed;
  u.onend=()=>{ btn.classList.remove('speaking'); btn.textContent='🔊 듣기'; currentUtterance=null; };
  u.onerror=()=>{ btn.classList.remove('speaking'); btn.textContent='🔊 듣기'; currentUtterance=null; };
  currentUtterance=u; speechSynthesis.speak(u);
}

function markQ(no, type, btn){
  const qd = document.getElementById('qd-'+no);
  const stEl = document.getElementById('st-'+no);
  const prevType = qd.dataset.marked;
  if(prevType==='ok') score.ok--;
  if(prevType==='ng') score.ng--;
  if(prevType===type){
    qd.removeAttribute('data-marked');
    qd.classList.remove('answered-ok','answered-ng');
    stEl.textContent='⬜';
    btn.classList.remove('selected');
  } else {
    qd.dataset.marked=type;
    qd.classList.remove('answered-ok','answered-ng');
    qd.classList.add('answered-'+type);
    stEl.textContent = type==='ok'?'✅':'❌';
    qd.querySelectorAll('.btn-ok,.btn-ng').forEach(b=>b.classList.remove('selected'));
    btn.classList.add('selected');
    if(type==='ok') score.ok++;
    else score.ng++;
  }
  updateScore();
}

function updateScore(){
  const tot = score.ok + score.ng;
  document.getElementById('sTot').textContent = tot;
  document.getElementById('sOk').textContent = score.ok;
  document.getElementById('sNg').textContent = score.ng;
  document.getElementById('sPct').textContent = tot ? Math.round(score.ok/tot*100)+'%' : '0%';
  const pct = Math.round(tot/TOTAL*100);
  document.getElementById('progFill').style.width = pct+'%';
  document.getElementById('progLabel').textContent = `${tot} / ${TOTAL} 문제 완료 (${pct}%)`;
}

function resetAll(){
  score={ok:0,ng:0};
  document.querySelectorAll('.q-details').forEach(d=>{
    d.removeAttribute('data-marked');
    d.classList.remove('answered-ok','answered-ng');
  });
  document.querySelectorAll('.q-status').forEach(s=>s.textContent='⬜');
  document.querySelectorAll('.btn-ok,.btn-ng').forEach(b=>b.classList.remove('selected'));
  document.querySelectorAll('.ans-box').forEach(b=>b.classList.remove('visible'));
  document.querySelectorAll('.hint-box').forEach(b=>b.classList.remove('visible'));
  document.querySelectorAll('.btn-show-ans').forEach(b=>b.textContent='✅ 정답 확인');
  document.querySelectorAll('.btn-hint').forEach(b=>b.textContent='💡 힌트 보기');
  updateScore();
}

function expandAll(){ document.querySelectorAll('.q-details').forEach(d=>d.setAttribute('open','')); }
function collapseAll(){ document.querySelectorAll('.q-details').forEach(d=>d.removeAttribute('open')); }

function filterPart(p, btn){
  currentPartFilter = p;
  document.querySelectorAll('.ctrl-bar .part-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function filterQ(){ applyFilters(); }

function applyFilters(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  document.querySelectorAll('.q-wrap').forEach(w=>{
    const partMatch = !currentPartFilter || parseInt(w.dataset.part)===currentPartFilter;
    const textMatch = !q || w.dataset.text.includes(q);
    w.classList.toggle('hidden', !partMatch || !textMatch);
  });
  document.querySelectorAll('.section-hdr').forEach(h=>{
    if(currentPartFilter && parseInt(h.dataset.part)!==currentPartFilter){h.classList.add('hidden');return;}
    let nxt = h.nextElementSibling;
    let has = false;
    while(nxt && !nxt.classList.contains('section-hdr')){
      if(!nxt.classList.contains('hidden')) has=true;
      nxt=nxt.nextElementSibling;
    }
    h.classList.toggle('hidden', !has);
  });
}

buildQuestions();
</script>
</body>
</html>
