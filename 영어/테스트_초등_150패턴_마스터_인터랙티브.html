<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 150패턴 마스터 테스트 | 한글↔영어 인터랙티브</title>
  <script src="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --radius: 16px;
      --shadow: 0 4px 18px rgba(0,0,0,0.10);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.08);
      --transition: 0.25s ease;
      --main-grad: linear-gradient(135deg, #11998e, #38ef7d);
      --bg-grad: linear-gradient(160deg, #e6fffa 0%, #e8f5e9 50%, #f1f8e9 100%);
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      background: var(--bg-grad);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 120px;
    }

    /* ====== HEADER ====== */
    .header {
      text-align: center;
      padding: 28px 20px 24px;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 2.2em;
      color: #2c3e50;
      letter-spacing: -0.5px;
      background: var(--main-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p { color: #7f8c8d; font-size: 1em; margin-top: 6px; }
    .header-meta {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .meta-badge {
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.82em;
      font-weight: 700;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .meta-badge.blue { background: #e3f2fd; color: #1565c0; }
    .meta-badge.purple { background: #f3e5f5; color: #6a1b9a; }

    /* ====== PROGRESS BAR ====== */
    .progress-wrap {
      margin-top: 14px;
      background: #ecf0f1;
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #11998e, #38ef7d);
      border-radius: 10px;
      width: 0%;
      transition: width 0.4s ease;
    }
    #progressText { margin-top: 6px; font-size: 0.88em; color: #95a5a6; }

    /* ====== SETTINGS PANEL ====== */
    .settings-panel {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      margin-bottom: 14px;
      overflow: hidden;
    }
    .settings-header {
      padding: 15px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--main-grad);
      color: white;
      user-select: none;
      transition: opacity var(--transition);
    }
    .settings-header:hover { opacity: 0.92; }
    .settings-header-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1em; }
    .settings-body {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
    }
    .setting-item label {
      display: block;
      font-size: 0.85em;
      font-weight: 700;
      color: #555;
      margin-bottom: 8px;
    }
    .setting-item select {
      width: 100%;
      padding: 9px 12px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 0.88em;
      background: #fafafa;
      cursor: pointer;
      transition: border-color var(--transition);
    }
    .setting-item select:focus { outline: none; border-color: #11998e; }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    .slider-val {
      min-width: 40px;
      text-align: right;
      font-size: 0.85em;
      font-weight: 700;
      color: #11998e;
    }
    input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #e0e0e0;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #11998e;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(17, 153, 142, 0.4);
    }

    /* ====== GLOBAL CONTROLS ====== */
    .global-controls {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 18px 22px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
    }
    .ctrl-group { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .ctrl-label { font-size: 0.88em; font-weight: 700; color: #555; }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 0.92em;
      font-weight: 700;
      transition: all var(--transition);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-green  { background: #4CAF50; color: white; }
    .btn-orange { background: #FF9800; color: white; }
    .btn-red    { background: #ef5350; color: white; }
    .btn-teal   { background: #11998e; color: white; }
    .btn-sm { padding: 7px 14px; font-size: 0.83em; }

    .separator { width: 1px; height: 32px; background: #e0e0e0; }

    /* ====== PART FILTER ====== */
    .filter-bar {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 12px 22px;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 0.88em; font-weight: 700; color: #555; }
    .filter-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      color: #555;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 700;
      transition: all var(--transition);
    }
    .filter-btn:hover { border-color: #11998e; color: #11998e; }
    .filter-btn.active {
      background: #11998e;
      color: white;
      border-color: #11998e;
    }

    /* ====== QUIZ CONTROLS ====== */
    .quiz-bar {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 12px 22px;
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .quiz-label { font-size: 0.88em; font-weight: 700; color: #555; }
    .quiz-btn {
      padding: 8px 16px;
      border: 2px solid #e0e0e0;
      background: white;
      color: #555;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85em;
      font-weight: 700;
      transition: all var(--transition);
    }
    .quiz-btn:hover { border-color: #FF9800; color: #FF9800; }
    .quiz-btn.active {
      background: #FF9800;
      color: white;
      border-color: #FF9800;
    }

    /* ====== QUIZ SCORE BAR ====== */
    .quiz-score-bar {
      display: none;
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 14px 22px;
      margin-bottom: 14px;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .quiz-score-bar.visible { display: flex; }
    .quiz-score-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95em;
      font-weight: 700;
    }
    .quiz-score-item .score-num {
      font-size: 1.3em;
      min-width: 32px;
      text-align: center;
    }
    .score-correct { color: #4CAF50; }
    .score-wrong { color: #EF5350; }
    .score-remaining { color: #78909C; }

    /* ====== SEARCH ====== */
    .search-box {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      padding: 14px 22px;
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1em;
      transition: border-color var(--transition);
    }
    .search-input:focus { outline: none; border-color: #11998e; }

    /* ====== SECTION HEADERS ====== */
    .category-section {
      background: white;
      border-radius: var(--radius);
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .category-header {
      padding: 16px 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      transition: opacity var(--transition);
      background: white;
      border-bottom: 2px solid #f0f0f0;
    }
    .category-header:hover { opacity: 0.93; }
    .cat-title-group { display: flex; align-items: center; gap: 14px; }
    .cat-emoji { font-size: 2em; }
    .cat-name { font-size: 1.1em; font-weight: 800; color: #2c3e50; }
    .cat-count {
      background: #f0f2f5;
      color: #555;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      font-weight: 700;
    }
    .chevron { color: #2c3e50; font-size: 1.1em; transition: transform 0.3s; }
    .category-section.open .chevron { transform: rotate(180deg); }

    .category-body {
      display: none;
      padding: 18px;
      background: #f8fafc;
    }
    .category-section.open .category-body { display: block; }

    .cat-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }

    /* ====== SENTENCE CARDS GRID ====== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .sentence-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border-left: 5px solid #ccc;
      transition: all 0.3s;
      position: relative;
    }

    @keyframes pulseGlow {
      0%   { box-shadow: 0 0 0 0 rgba(17, 153, 142, 0.45); }
      60%  { box-shadow: 0 0 0 10px rgba(17, 153, 142, 0); }
      100% { box-shadow: 0 0 0 0 rgba(17, 153, 142, 0); }
    }
    .sentence-card.playing {
      transform: scale(1.015);
      outline: 2px solid #11998e;
      animation: pulseGlow 1.4s infinite;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .card-num {
      background: #f0f2f5;
      color: #888;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75em;
      font-weight: 800;
    }
    .card-play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1em;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      background: #11998e;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .card-play-btn:hover { transform: scale(1.12); }

    .card-english {
      font-size: 1.35em;
      font-weight: 800;
      color: #2c3e50;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .card-english.quiz-hidden {
      filter: blur(8px);
      cursor: pointer;
      user-select: none;
      transition: filter 0.3s;
    }
    .card-english.quiz-hidden:hover { filter: blur(5px); }
    .card-english.quiz-revealed { filter: none !important; }

    .card-korean {
      font-size: 1em;
      color: #555;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .card-korean.quiz-hidden {
      filter: blur(8px);
      cursor: pointer;
      user-select: none;
      transition: filter 0.3s;
    }
    .card-korean.quiz-hidden:hover { filter: blur(5px); }
    .card-korean.quiz-revealed { filter: none !important; }

    .card-hint {
      display: inline-block;
      background: #FFF3E0;
      color: #E65100;
      font-size: 0.75em;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .card-qa {
      border-top: 1px solid #f0f0f0;
      padding-top: 10px;
    }

    .quiz-check-buttons {
      display: none;
      gap: 8px;
      margin-top: 10px;
    }
    .quiz-active .quiz-check-buttons { display: flex; }

    .btn-correct {
      padding: 6px 14px;
      background: #E8F5E9;
      color: #2E7D32;
      border: none;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-correct:hover { transform: scale(1.08); background: #C8E6C9; }

    .btn-wrong {
      padding: 6px 14px;
      background: #FFEBEE;
      color: #C62828;
      border: none;
      border-radius: 20px;
      font-size: 0.8em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-wrong:hover { transform: scale(1.08); background: #EF9A9A; }

    .quiz-result-icon {
      display: none;
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 1.6em;
      z-index: 2;
    }
    .quiz-active .quiz-result-icon { display: block; }

    .sentence-card.quiz-correct { border-left-color: #4CAF50 !important; background: #F1F8E9; }
    .sentence-card.quiz-wrong { border-left-color: #EF5350 !important; background: #FFEBEE; }

    /* ====== FLOATING MINI PLAYER ====== */
    #miniPlayer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: white;
      border-radius: 14px;
      padding: 12px 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      display: none;
      z-index: 999;
      min-width: 220px;
      max-width: 300px;
    }
    #miniPlayer.visible { display: block; }
    .mini-now { font-size: 0.78em; color: #95a5a6; margin-bottom: 4px; }
    .mini-text { font-size: 1em; font-weight: 700; color: #2c3e50; line-height: 1.4; }
    .mini-controls { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 600px) {
      .header h1 { font-size: 1.6em; }
      .cards-grid { grid-template-columns: 1fr; }
      .global-controls { flex-direction: column; align-items: flex-start; }
      .settings-body { grid-template-columns: 1fr; }
      #miniPlayer { min-width: 200px; }
    }

    .hidden { display: none !important; }

    /* Twemoji size fix */
    img.emoji {
      width: 1.2em !important;
      height: 1.2em !important;
      vertical-align: -0.15em;
      margin: 0 1px;
    }
    .cat-emoji img.emoji {
      width: 1.6em !important;
      height: 1.6em !important;
    }
  </style>
</head>
<body>

<!-- ====== HEADER ====== -->
<div class="header">
  <h1>🎯 초등 150패턴 마스터 테스트</h1>
  <p>한글 ↔ 영어 인터랙티브 학습 | Interactive Korean ↔ English</p>
  <div class="header-meta">
    <span class="meta-badge">📚 120개 문제 × Part 1~4</span>
    <span class="meta-badge blue">🎯 한글→영어 / 영어→한글 / 청크 채우기 / 대화 완성</span>
    <span class="meta-badge purple">🔊 Web Speech API</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="globalProgressBar"></div>
  </div>
  <div id="progressText">0 / 120 문제</div>
</div>

<!-- ====== SETTINGS PANEL ====== -->
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header" onclick="toggleSettings()">
    <div class="settings-header-title">⚙️ 음성 설정 (Voice Settings)</div>
    <span id="settingsChevron">▼</span>
  </div>
  <div class="settings-body" id="settingsBody" style="display: none;">
    <div class="setting-item">
      <label>🎤 목소리 선택</label>
      <select id="voiceSelect"><option>음성 로딩 중…</option></select>
    </div>
    <div class="setting-item">
      <label>🐢 읽기 속도 (Rate)</label>
      <div class="slider-row">
        <input type="range" id="rateSlider" min="0.3" max="2.0" step="0.05" value="0.85">
        <span class="slider-val" id="rateVal">0.85×</span>
      </div>
    </div>
    <div class="setting-item">
      <label>🎵 음높이 (Pitch)</label>
      <div class="slider-row">
        <input type="range" id="pitchSlider" min="0.5" max="2.0" step="0.05" value="1.2">
        <span class="slider-val" id="pitchVal">1.20</span>
      </div>
    </div>
    <div class="setting-item">
      <label>🔊 볼륨 (Volume)</label>
      <div class="slider-row">
        <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1.0">
        <span class="slider-val" id="volumeVal">100%</span>
      </div>
    </div>
    <div class="setting-item">
      <label>⏱ 문장 간 간격 (Interval)</label>
      <div class="slider-row">
        <input type="range" id="intervalSlider" min="0" max="10000" step="200" value="400">
        <span class="slider-val" id="intervalVal">0.4초</span>
      </div>
    </div>
    <div class="setting-item" style="align-self: flex-end;">
      <label>&nbsp;</label>
      <button class="btn btn-teal" onclick="testVoice()">🎧 테스트 듣기</button>
    </div>
  </div>
</div>

<!-- ====== GLOBAL CONTROLS ====== -->
<div class="global-controls">
  <div class="ctrl-group">
    <button class="btn btn-green" id="btnPlayAll" onclick="playAll()">▶ 전체 듣기</button>
    <button class="btn btn-orange" id="btnPause" onclick="togglePause()" disabled>⏸ 일시정지</button>
    <button class="btn btn-red" id="btnStop" onclick="stopAll()" disabled>⏹ 정지</button>
  </div>
  <div class="separator"></div>
  <div class="ctrl-group" style="align-items:center; gap:8px; flex-wrap:wrap;">
    <span style="font-size:0.82rem; font-weight:600; color:#555; white-space:nowrap;">⏱ 문장 간격</span>
    <input type="range" id="intervalSliderGlobal" min="0" max="10000" step="200" value="400"
      style="width:180px; accent-color:#0d9488; cursor:pointer;">
    <span id="intervalValGlobal" style="font-size:0.88rem; font-weight:700; color:#0d9488; min-width:40px; text-align:right;">0.4초</span>
  </div>
  <div class="separator"></div>
  <div class="ctrl-group">
    <button class="btn btn-teal btn-sm" onclick="openAllSections()">📂 모두 열기</button>
    <button class="btn btn-teal btn-sm" onclick="closeAllSections()">📁 모두 닫기</button>
  </div>
</div>

<!-- ====== PART FILTER ====== -->
<div class="filter-bar">
  <span class="filter-label">📋 파트 필터:</span>
  <button class="filter-btn active" data-part="0" onclick="filterByPart(0)">전체</button>
  <button class="filter-btn" data-part="1" onclick="filterByPart(1)">Part 1: 한글→영어</button>
  <button class="filter-btn" data-part="2" onclick="filterByPart(2)">Part 2: 영어→한글</button>
  <button class="filter-btn" data-part="3" onclick="filterByPart(3)">Part 3: 청크 채우기</button>
  <button class="filter-btn" data-part="4" onclick="filterByPart(4)">Part 4: 대화 완성</button>
</div>

<!-- ====== QUIZ CONTROLS ====== -->
<div class="quiz-bar">
  <span class="quiz-label">🎯 퀴즈 모드:</span>
  <button class="quiz-btn active" data-quiz="none" onclick="setQuizMode('none')">전체보기</button>
  <button class="quiz-btn" data-quiz="ko-en" onclick="setQuizMode('ko-en')">한글→영어</button>
  <button class="quiz-btn" data-quiz="en-ko" onclick="setQuizMode('en-ko')">영어→한글</button>
</div>

<!-- ====== QUIZ SCORE BAR ====== -->
<div class="quiz-score-bar" id="quizScoreBar">
  <div class="quiz-score-item score-correct">
    <span>✅ 정답:</span>
    <span class="score-num" id="scoreCorrect">0</span>
  </div>
  <div class="quiz-score-item score-wrong">
    <span>❌ 오답:</span>
    <span class="score-num" id="scoreWrong">0</span>
  </div>
  <div class="quiz-score-item score-remaining">
    <span>📝 남은 문제:</span>
    <span class="score-num" id="scoreRemaining">0</span>
  </div>
</div>

<!-- ====== SEARCH ====== -->
<div class="search-box">
  <input type="text" class="search-input" id="searchInput" placeholder="문제 검색... (한글 또는 영어)">
</div>

<!-- ====== CATEGORIES & CARDS ====== -->
<div id="categoriesContainer"></div>

<!-- ====== MINI PLAYER ====== -->

let currentPart = 0;
let quizMode = 'none';
let isPlaying = false;
let currentPlayIndex = -1;
let filteredQuestions = [...QUESTIONS];
let quizScores = {
  correct: 0,
  wrong: 0,
  remaining: QUESTIONS.length
};

const voiceSettings = {
  rate: 0.85,
  pitch: 1.2,
  volume: 1.0,
  interval: 400
};

document.addEventListener('DOMContentLoaded', function() {
  initVoices();
  renderCategories();
  updateProgress();
  setupSearchListener();
  setupSliderListeners();
});

document.addEventListener('keydown', function(e) {
  if (e.code === 'Space') {
    e.preventDefault();
    togglePause();
  }
  if (e.code === 'Enter') {
    e.preventDefault();
    playAll();
  }
});

function initVoices() {
  const synth = window.speechSynthesis;
  synth.onvoiceschanged = () => {
    const voices = synth.getVoices();
    const select = document.getElementById('voiceSelect');
    select.innerHTML = '';
    voices.forEach((voice, idx) => {
      const opt = document.createElement('option');
      opt.textContent = voice.name + ' (' + voice.lang + ')';
      opt.value = idx;
      select.appendChild(opt);
    });
    const enVoice = voices.findIndex(v => v.lang.includes('en'));
    if (enVoice >= 0) select.value = enVoice;
  };
  synth.getVoices();
}

function toggleSettings() {
  const body = document.getElementById('settingsBody');
  body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

function setupSliderListeners() {
  document.getElementById('rateSlider').addEventListener('input', (e) => {
    voiceSettings.rate = parseFloat(e.target.value);
    document.getElementById('rateVal').textContent = e.target.value + '×';
  });
  document.getElementById('pitchSlider').addEventListener('input', (e) => {
    voiceSettings.pitch = parseFloat(e.target.value);
    document.getElementById('pitchVal').textContent = parseFloat(e.target.value).toFixed(2);
  });
  document.getElementById('volumeSlider').addEventListener('input', (e) => {
    voiceSettings.volume = parseFloat(e.target.value);
    document.getElementById('volumeVal').textContent = Math.round(e.target.value * 100) + '%';
  });
  // 설정 패널 인터벌 슬라이더 (글로벌 슬라이더와 동기화)
  document.getElementById('intervalSlider').addEventListener('input', (e) => {
    const ms = parseInt(e.target.value);
    voiceSettings.interval = ms;
    const label = (ms / 1000).toFixed(1) + '초';
    document.getElementById('intervalVal').textContent = label;
    document.getElementById('intervalSliderGlobal').value = ms;
    document.getElementById('intervalValGlobal').textContent = label;
  });

  // 글로벌 컨트롤 인터벌 슬라이더 (설정 패널 슬라이더와 동기화)
  document.getElementById('intervalSliderGlobal').addEventListener('input', (e) => {
    const ms = parseInt(e.target.value);
    voiceSettings.interval = ms;
    const label = (ms / 1000).toFixed(1) + '초';
    document.getElementById('intervalValGlobal').textContent = label;
    document.getElementById('intervalSlider').value = ms;
    document.getElementById('intervalVal').textContent = label;
  });
}

function testVoice() {
  speak('Test voice audio');
}

function speak(text, onEnd = null) {
  const synth = window.speechSynthesis;
  synth.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = voiceSettings.rate;
  utterance.pitch = voiceSettings.pitch;
  utterance.volume = voiceSettings.volume;

  const voiceIdx = parseInt(document.getElementById('voiceSelect').value);
  const voices = synth.getVoices();
  if (voices[voiceIdx]) utterance.voice = voices[voiceIdx];

  utterance.onend = onEnd || (() => {});
  synth.speak(utterance);
}

function playAll() {
  if (!filteredQuestions.length) return;
  isPlaying = true;
  currentPlayIndex = 0;
  document.getElementById('btnPlayAll').disabled = true;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('miniPlayer').classList.add('visible');
  playNext();
}

function playNext() {
  if (!isPlaying || currentPlayIndex >= filteredQuestions.length) {
    stopAll();
    return;
  }

  const q = filteredQuestions[currentPlayIndex];
  const cardEl = document.querySelector('[data-qid="' + q.no + '"]');
  if (cardEl) {
    cardEl.classList.add('playing');
    cardEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  updateMiniPlayer(q);

  const textToSpeak = q.en;
  const idx = currentPlayIndex;

  speak(textToSpeak, () => {
    if (cardEl) cardEl.classList.remove('playing');
    if (isPlaying && idx === currentPlayIndex) {
      currentPlayIndex++;
      setTimeout(playNext, voiceSettings.interval);
    }
  });
}

function togglePause() {
  const synth = window.speechSynthesis;
  if (synth.paused) {
    synth.resume();
    document.getElementById('btnPause').textContent = '⏸ 일시정지';
  } else {
    synth.pause();
    document.getElementById('btnPause').textContent = '▶ 재개';
  }
}

function stopAll() {
  window.speechSynthesis.cancel();
  isPlaying = false;
  currentPlayIndex = -1;
  document.querySelectorAll('.sentence-card.playing').forEach(el => el.classList.remove('playing'));
  document.getElementById('btnPlayAll').disabled = false;
  document.getElementById('btnPause').disabled = true;
  document.getElementById('btnStop').disabled = true;
  document.getElementById('btnPause').textContent = '⏸ 일시정지';
  document.getElementById('miniPlayer').classList.remove('visible');
}

function updateMiniPlayer(q) {
  document.getElementById('miniPlayerText').textContent = q.en;
}

function playSectionQuestions(sectionCat, part) {
  const questions = filteredQuestions.filter(q => q.cat === sectionCat && q.part === part);
  if (!questions.length) return;

  isPlaying = true;
  currentPlayIndex = 0;
  const origFiltered = filteredQuestions;
  filteredQuestions = questions;

  document.getElementById('btnPlayAll').disabled = true;
  document.getElementById('btnPause').disabled = false;
  document.getElementById('btnStop').disabled = false;
  document.getElementById('miniPlayer').classList.add('visible');

  playNext();

  const stopOverride = stopAll;
  stopAll = function() {
    stopOverride();
    filteredQuestions = origFiltered;
  };
}

function playCard(qid) {
  const q = QUESTIONS.find(x => x.no === qid);
  if (!q) return;
  speak(q.en, () => {
    document.querySelector('[data-qid="' + qid + '"]')?.classList.remove('playing');
  });
  document.querySelector('[data-qid="' + qid + '"]')?.classList.add('playing');
  updateMiniPlayer(q);
}

function filterByPart(part) {
  currentPart = part;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn[data-part="' + part + '"]').classList.add('active');
  updateFiltered();
}

function setupSearchListener() {
  document.getElementById('searchInput').addEventListener('input', (e) => {
    updateFiltered();
  });
}

function updateFiltered() {
  const searchVal = document.getElementById('searchInput').value.toLowerCase();
  filteredQuestions = QUESTIONS.filter(q => {
    const partMatch = currentPart === 0 || q.part === currentPart;
    const searchMatch = !searchVal ||
      q.ko.toLowerCase().includes(searchVal) ||
      q.en.toLowerCase().includes(searchVal) ||
      q.q.toLowerCase().includes(searchVal);
    return partMatch && searchMatch;
  });
  renderCategories();
  updateProgress();
}

function setQuizMode(mode) {
  quizMode = mode;
  document.querySelectorAll('.quiz-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.quiz-btn[data-quiz="' + mode + '"]').classList.add('active');

  if (mode !== 'none') {
    document.querySelector('.quiz-score-bar').classList.add('visible');
    document.querySelectorAll('.sentence-card').forEach(card => {
      card.classList.add('quiz-active');
    });
    quizScores = { correct: 0, wrong: 0, remaining: filteredQuestions.length };
    updateQuizScore();
  } else {
    document.querySelector('.quiz-score-bar').classList.remove('visible');
    document.querySelectorAll('.sentence-card').forEach(card => {
      card.classList.remove('quiz-active', 'quiz-correct', 'quiz-wrong');
    });
  }

  renderCategories();
}

function markQuizAnswer(qid, isCorrect) {
  const card = document.querySelector('[data-qid="' + qid + '"]');
  if (!card) return;

  // 블러 처리된 답 공개
  card.querySelectorAll('.quiz-hidden').forEach(el => el.classList.add('quiz-revealed'));

  // 버튼 잠금 (재수정 불가)
  card.querySelectorAll('.btn-correct, .btn-wrong').forEach(b => {
    b.disabled = true;
    b.style.opacity = '0.5';
    b.style.cursor = 'not-allowed';
  });

  if (isCorrect) {
    quizScores.correct++;
    card.classList.add('quiz-correct');
    card.querySelector('.quiz-result-icon').textContent = '✅';
  } else {
    quizScores.wrong++;
    card.classList.add('quiz-wrong');
    card.querySelector('.quiz-result-icon').textContent = '❌';
  }

  quizScores.remaining = filteredQuestions.length - (quizScores.correct + quizScores.wrong);
  updateQuizScore();
}

function updateQuizScore() {
  document.getElementById('scoreCorrect').textContent = quizScores.correct;
  document.getElementById('scoreWrong').textContent = quizScores.wrong;
  document.getElementById('scoreRemaining').textContent = quizScores.remaining;
}

function openAllSections() {
  document.querySelectorAll('.category-section').forEach(sec => {
    sec.classList.add('open');
  });
}

function closeAllSections() {
  document.querySelectorAll('.category-section').forEach(sec => {
    sec.classList.remove('open');
  });
}

function toggleSection(cat, part) {
  const secId = 'sec-' + part + '-' + cat.replace(/\s+/g, '_');
  const sec = document.getElementById(secId);
  if (sec) sec.classList.toggle('open');
}

function renderCategories() {
  const container = document.getElementById('categoriesContainer');
  container.innerHTML = '';

  const grouped = {};
  filteredQuestions.forEach(q => {
    const key = q.part + '|' + q.cat;
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(q);
  });

  Object.entries(grouped).sort().forEach(([key, questions]) => {
    const parts = key.split('|');
    const partNum = parseInt(parts[0]);
    const cat = parts[1];
    const emoji = CATEGORY_EMOJIS[cat] || '📌';
    const secId = 'sec-' + partNum + '-' + cat.replace(/\s+/g, '_');

    const section = document.createElement('div');
    section.className = 'category-section';
    section.id = secId;

    let headerHtml = '<div class="category-header" onclick="toggleSection(\'' + cat.replace(/'/g, "\\'") + '\', ' + partNum + ')">';
    headerHtml += '<div class="cat-title-group"><span class="cat-emoji">' + emoji + '</span>';
    headerHtml += '<div><div class="cat-name">' + cat + '</div></div></div>';
    headerHtml += '<div style="display: flex; align-items: center; gap: 12px;">';
    headerHtml += '<span class="cat-count">' + questions.length + '문제</span>';
    headerHtml += '<span class="chevron">▼</span></div></div>';

    let bodyHtml = '<div class="category-body">';
    bodyHtml += '<div class="cat-actions">';
    bodyHtml += '<button class="btn btn-teal btn-sm" onclick="playSectionQuestions(\'' + cat.replace(/'/g, "\\'") + '\', ' + partNum + ')">▶ 섹션 듣기</button>';
    bodyHtml += '</div>';
    bodyHtml += '<div class="cards-grid" id="grid-' + secId + '"></div>';
    bodyHtml += '</div>';

    section.innerHTML = headerHtml + bodyHtml;
    container.appendChild(section);

    const grid = document.getElementById('grid-' + secId);
    questions.forEach(q => {
      const card = renderCard(q);
      grid.appendChild(card);
    });
  });
}

function renderCard(q) {
  const card = document.createElement('div');
  card.className = 'sentence-card';
  card.setAttribute('data-qid', q.no);
  if (quizMode !== 'none') {
    card.classList.add('quiz-active');
  }

  let enClass = '';
  let koClass = '';

  if (quizMode === 'ko-en') {
    enClass = 'quiz-hidden';
  } else if (quizMode === 'en-ko') {
    koClass = 'quiz-hidden';
  }

  let cardHtml = '<div class="card-top"><span class="card-num">No. ' + q.no + '</span>';
  cardHtml += '<button class="card-play-btn" onclick="playCard(\'' + q.no + '\')">🔊</button></div>';
  cardHtml += '<div class="card-english ' + enClass + '" onclick="revealElement(this)">' + q.en + '</div>';
  cardHtml += '<div class="card-korean ' + koClass + '" onclick="revealElement(this)">' + q.ko + '</div>';
  if (q.hint) {
    cardHtml += '<div class="card-hint">' + q.ht + ' ' + q.hint + '</div>';
  }
  if (quizMode !== 'none') {
    cardHtml += '<div class="quiz-result-icon"></div>';
    cardHtml += '<div class="card-qa">';
    cardHtml += '<div class="quiz-check-buttons">';
    cardHtml += '<button class="btn-correct" onclick="markQuizAnswer(\'' + q.no + '\', true)">✅ 정답</button>';
    cardHtml += '<button class="btn-wrong" onclick="markQuizAnswer(\'' + q.no + '\', false)">❌ 오답</button>';
    cardHtml += '</div></div>';
  }

  card.innerHTML = cardHtml;
  return card;
}

function revealElement(el) {
  if (el.classList.contains('quiz-hidden')) {
    el.classList.add('quiz-revealed');
  }
}

function updateProgress() {
  const total = QUESTIONS.length;
  const current = filteredQuestions.length;
  const percent = (current / total) * 100;

  document.getElementById('globalProgressBar').style.width = percent + '%';
  document.getElementById('progressText').textContent = current + ' / ' + total + ' 문제';
}
</script>
</body>
